<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- VaultLink Plugin Icon (Central Hub Scaled Up 10% to 1.056) -->
  <defs>
    <!-- Reusable Obsidian Crystal (Flattened to exact flat palette colors #8B5CF6 and #4C1D95) -->
    <g id="obsidian-node">
      <polygon points="0,0 -101,24 -37,-120" fill="#8B5CF6" stroke="#8B5CF6" stroke-width="1" stroke-linejoin="round" />
      <polygon points="0,0 -37,-120 19,-112 99,-16 51,104" fill="#8B5CF6" stroke="#8B5CF6" stroke-width="1" stroke-linejoin="round" />
      <polygon points="0,0 51,104 -37,128 -101,24" fill="#4C1D95" stroke="#4C1D95" stroke-width="1" stroke-linejoin="round" />
    </g>

    <!-- Transparent Cutout Mask for Center Spoke Gaps (Scaled proportionally to match 1.056x hub) -->
    <mask id="gap-mask">
      <rect x="0" y="0" width="512" height="512" fill="white" />
      <circle cx="256" cy="280" r="103.34" fill="black" />
    </mask>
  </defs>

  <!-- Spoke Connections -->
  <g mask="url(#gap-mask)">
    <!-- Top Arm (#4C1D95) -->
    <path d="M 256 280 L 256 80"
          stroke="#4C1D95" stroke-width="16.8" stroke-linecap="round" />
    <!-- Bottom Arms (#8B5CF6) -->
    <path d="M 256 280 L 110 390 M 256 280 L 402 390"
          stroke="#8B5CF6" stroke-width="16.8" stroke-linecap="round" />
  </g>

  <!-- Central Chat Hub (Scaled up 10% from 0.96 to 1.056) -->
  <g transform="translate(256, 280) scale(1.056)">
    <!-- Base Blue Circle -->
    <circle cx="0" cy="0" r="89.86" fill="#3B82F6" />

    <!-- Crescent Ring Base: Outer White Circle (r=58.3) -->
    <circle cx="0" cy="0" r="58.3" fill="#FFFFFF" />
    <!-- Crescent Ring Bugle: Inner circle (cx=2.5, cy=-7.0, r=42) -->
    <circle cx="2.5" cy="-7.0" r="42" fill="#3B82F6" />

    <!-- Inner Teardrop with Background Clearance Stroke -->
    <g transform="rotate(20) translate(0, -27) translate(0, -34) scale(1.2) translate(0, 34)">
      <!-- Blue stroke matching hub background, carving the top gap through the crescent -->
      <path d="M 0,-34 L 15,14 A 15,15 0 0,1 -15,14 Z" fill="none" stroke="#3B82F6" stroke-width="32" stroke-linejoin="round" stroke-linecap="round" />
      <!-- White teardrop fill on top -->
      <path d="M 0,-34 L 15,14 A 15,15 0 0,1 -15,14 Z" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Outer Obsidian Vault Crystals (Scaled down to 0.32) -->
  <use href="#obsidian-node" transform="translate(256, 80) scale(0.32)" />
  <use href="#obsidian-node" transform="translate(110, 390) scale(0.32)" />
  <use href="#obsidian-node" transform="translate(402, 390) scale(0.32)" />
</svg>
