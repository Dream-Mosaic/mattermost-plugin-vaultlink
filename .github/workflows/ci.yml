name: CI

# Self-contained CI. We intentionally do NOT use the upstream reusable workflow
# (mattermost/actions-workflows/.github/workflows/plugin-ci.yml). Its build step
# uploads the plugin .tar.gz as a GitHub artifact via a composite action we can't
# configure, and that artifact is only ever consumed by its `delivery` job — which
# is gated on `github.repository_owner == 'mattermost'` and so never runs on this
# fork. The result was uploaded-but-unused artifacts piling up until they hit the
# free-plan storage quota and broke CI. Running the same checks inline (lint, test,
# build) gives identical coverage with no artifact upload. Deploys are handled
# separately by deploy.yml (which rebuilds with `make dist`), so nothing here needs
# to persist the build output.

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "webapp/**"
      - "plugin.json"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "build/**"
      - ".github/workflows/ci.yml"
  # Deliberately unfiltered. These jobs are required status checks, and a
  # workflow skipped by a path filter never reports its check at all -- the PR
  # then waits forever on "Expected - Waiting for status to be reported" and
  # cannot be merged. GitHub's guidance is explicit: do not path-filter a
  # workflow that is required to pass before merging. The push trigger above
  # keeps its filters, since nothing gates it.
  #
  # If the suite ever gets slow enough that this is annoying, gate the
  # expensive jobs with a job-level `if:` instead -- a job skipped by a
  # conditional reports Success, so required checks stay satisfied.
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Lint Go (golangci-lint via make check-style)
        run: make check-style

      - name: Type-check and lint webapp
        run: cd webapp && npm ci && npm run check-types && npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run Go tests
        run: make test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build plugin bundle (make dist)
        run: make dist
